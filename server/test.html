<!DOCTYPE html>
<html>
<head>
  <title>MelanMed API Test</title>
</head>
<body>
  <h1>Test AI Chat</h1>
  <input 
    type="text" 
    id="message" 
    placeholder="Ask the AI for a doctor recommendation"
    style="width: 400px; padding: 8px;"
  />
  <button onclick="testAI()">Ask AI</button>

  <pre id="result" style="white-space: pre-wrap; max-width: 600px;"></pre>

  <script>
    async function testAI() {
      const message = document.getElementById('message').value;

      // fetch doctors first
      const doctorsResponse = await fetch('http://localhost:5001/api/doctors');
      const doctors = await doctorsResponse.json();

      // send to AI
      const response = await fetch('http://localhost:5001/api/ai/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, doctors })
      });

      const data = await response.json();
      document.getElementById('result').textContent = data.message;
    }
  </script>
</body>
</html>
